<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101216">
<link rel="manifest" href="manifest.webmanifest">
<title>FRACTURE — Glass Touch</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101216;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#242a31 0%,#15191f 54%,#0b0d11 100%);overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#top{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.brand{font-size:11px;letter-spacing:.28em;font-weight:700;color:#dce2e8}
.hint{font-size:10px;letter-spacing:.12em;color:#9ca6b1;text-align:right}
#bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 20px);left:0;right:0;display:flex;justify-content:center;pointer-events:none}
button{pointer-events:auto;border:1px solid #69727c;background:rgba(15,18,23,.72);color:#dce2e8;border-radius:30px;padding:10px 25px;font-size:10px;letter-spacing:.2em}
button:active{background:#39414a}
#permission{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 70px);left:50%;transform:translateX(-50%);font-size:10px;color:#9ca6b1;white-space:nowrap;opacity:0;pointer-events:none}
#permission.show{opacity:1}
</style>
</head>
<body>
<div id="stage">
<canvas id="glass"></canvas>
<div id="top"><div class="brand">FRACTURE <span style="font-weight:400;color:#8d98a3">/ GLASS TOUCH</span></div><div class="hint">TAP TO CRACK<br>DRAG TO SHATTER</div></div>
<div id="permission">端末の傾きセンサーを許可すると破片が動きます</div>
<div id="bottom"><button id="reset">RESET GLASS</button></div>
</div>
<script>
(() => {
const canvas=document.getElementById('glass'),ctx=canvas.getContext('2d');
let w=0,h=0,dpr=1, cracks=[], shards=[], particles=[], lastTime=0, tilt={x:0,y:0}, sensorReady=false;
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
addEventListener('resize',resize);
function vibrate(){if(navigator.vibrate) navigator.vibrate([8,12,5]);}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function makeCrack(x,y){
 const count=Math.floor(rand(13,19)), base=rand(0,Math.PI*2), id=cracks.length;
 const crack={x,y,lines:[],born:performance.now(),duration:rand(230,390)};
 for(let i=0;i<count;i++){
  const a=base+i*Math.PI*2/count+rand(-.13,.13), max= Math.hypot(Math.max(x,w-x),Math.max(y,h-y))*1.15;
  const len=max*rand(.48,1.02), steps=Math.max(5,Math.floor(len/42)), pts=[{x,y}];
  let px=x,py=y;
  for(let s=1;s<=steps;s++){
   const t=s/steps, bend=rand(-1,1)*Math.min(13,4+t*8);
   px=x+Math.cos(a)*len*t+Math.cos(a+Math.PI/2)*bend;
   py=y+Math.sin(a)*len*t+Math.sin(a+Math.PI/2)*bend;
   pts.push({x:px,y:py});
   if(px<0||px>w||py<0||py>h)break;
  }
  crack.lines.push({pts,delay:rand(0,95),width:rand(.65,1.45),main:true});
  if(Math.random()<.82){
   const k=Math.floor(rand(1,Math.max(2,pts.length-2))), p=pts[k], side=Math.random()<.5?-1:1;
   const ba=a+side*rand(.35,.85), bl=rand(45,Math.min(160,Math.max(55,len*.22))), bp=[{x:p.x,y:p.y}];
   for(let q=1;q<=3;q++)bp.push({x:p.x+Math.cos(ba)*bl*q/3+rand(-3,3),y:p.y+Math.sin(ba)*bl*q/3+rand(-3,3)});
   crack.lines.push({pts:bp,delay:rand(30,160),width:rand(.35,.8),main:false});
  }
 }
 cracks.push(crack);
 // Voronoi-like polygon fragments around impact; deterministic radial cells with slight offsets
 const n=18, sites=[];
 for(let i=0;i<n;i++){const a=base+i*2*Math.PI/n+rand(-.1,.1),r=rand(35,Math.min(w,h)*.43);sites.push({x:clamp(x+Math.cos(a)*r,0,w),y:clamp(y+Math.sin(a)*r,0,h),vx:Math.cos(a)*rand(.3,1.4),vy:Math.sin(a)*rand(.3,1.4),rot:rand(-.025,.025),angle:0});}
 for(let i=0;i<sites.length;i++){
  const s=sites[i], rad=rand(18,48), verts=[];
  const sides=Math.floor(rand(3,6));
  for(let j=0;j<sides;j++){const a=j*2*Math.PI/sides+rand(-.25,.25);verts.push({x:s.x+Math.cos(a)*rad*rand(.65,1.25),y:s.y+Math.sin(a)*rad*rand(.65,1.25)});}
  shards.push({x:s.x,y:s.y,verts, vx:s.vx,vy:s.vy,rot:s.rot,angle:0,life:1,alpha:rand(.025,.09),seed:rand(0,10)});
 }
 for(let i=0;i<26;i++)particles.push({x,y,vx:rand(-3,3),vy:rand(-3,3),life:1,r:rand(.5,1.7)});
 vibrate();draw();
}
function drawCrack(line,progress){
 const pts=line.pts, total=pts.length-1, f=clamp(progress,0,1), seg=f*total;
 if(seg<=0)return;
 ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
 for(let i=1;i<=Math.floor(seg);i++)ctx.lineTo(pts[i].x,pts[i].y);
 if(Math.floor(seg)<total){const t=seg-Math.floor(seg),a=pts[Math.floor(seg)],b=pts[Math.floor(seg)+1];ctx.lineTo(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t);}
 // bright glass edge
 ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
 ctx.shadowColor='rgba(210,235,255,.85)';ctx.shadowBlur=9;
 ctx.strokeStyle='rgba(215,232,245,.24)';ctx.lineWidth=line.width*4;ctx.stroke();
 ctx.shadowBlur=0;ctx.strokeStyle='rgba(245,250,255,.88)';ctx.lineWidth=line.width;ctx.stroke();
 ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=Math.max(.25,line.width*.22);ctx.stroke();
 ctx.restore();
 // parallel white refractive glint, offset from crack
 if(line.main){ctx.save();ctx.globalAlpha=.38;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=.55;ctx.beginPath();for(let i=0;i<pts.length;i++){const p=pts[i];const off=2.2; if(i===0)ctx.moveTo(p.x-off,p.y-off);else ctx.lineTo(p.x-off,p.y-off);}ctx.stroke();ctx.restore();}
}
function draw(now=performance.now()){
 ctx.clearRect(0,0,w,h);
 // faint glass sheen
 const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'rgba(255,255,255,.025)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(180,210,240,.025)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 for(const s of shards){
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.angle);
  ctx.beginPath();s.verts.forEach((p,i)=>i?ctx.lineTo(p.x-s.x,p.y-s.y):ctx.moveTo(p.x-s.x,p.y-s.y));ctx.closePath();
  ctx.fillStyle=`rgba(205,225,245,${s.alpha})`;ctx.fill();
  ctx.strokeStyle='rgba(235,246,255,.12)';ctx.lineWidth=.7;ctx.stroke();
  // subtle triangular reflection
  ctx.beginPath();ctx.moveTo(s.verts[0].x-s.x,s.verts[0].y-s.y);ctx.lineTo((s.verts[0].x+s.verts[1].x)/2-s.x,(s.verts[0].y+s.verts[1].y)/2-s.y);ctx.strokeStyle='rgba(255,255,255,.18)';ctx.stroke();
  ctx.restore();
 }
 for(const c of cracks){const elapsed=now-c.born;for(const l of c.lines){const p=clamp((elapsed-l.delay)/c.duration,0,1);drawCrack(l,p);}}
 for(const p of particles){ctx.globalAlpha=p.life*.45;ctx.fillStyle='#eef7ff';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;
}
function animate(t){const dt=Math.min(32,t-lastTime||16);lastTime=t;
 let moving=false;
 for(const s of shards){if(sensorReady){s.vx+=tilt.x*.018*dt;s.vy+=tilt.y*.018*dt;}s.vx*=.985;s.vy*=.985;s.x+=s.vx*dt*.035;s.y+=s.vy*dt*.035;s.angle+=s.rot*dt*.018;if(Math.abs(s.vx)+Math.abs(s.vy)>.06)moving=true;}
 for(const p of particles){p.x+=p.vx*dt*.04;p.y+=p.vy*dt*.04;p.life-=dt/550;}
 particles=particles.filter(p=>p.life>0);
 draw(t);
 const animating=cracks.some(c=>t-c.born<c.duration+180);
 if(animating||moving||particles.length)requestAnimationFrame(animate);
}
function startAnimation(){lastTime=performance.now();requestAnimationFrame(animate);}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const p=point(e);makeCrack(p.x,p.y);startAnimation();});
document.getElementById('reset').addEventListener('click',()=>{cracks=[];shards=[];particles=[];draw();});
function handleOrientation(e){if(e.gamma==null||e.beta==null)return;sensorReady=true;tilt.x=clamp(e.gamma/35,-1,1);tilt.y=clamp(e.beta/45,-1,1);}
addEventListener('deviceorientation',handleOrientation);
async function requestTilt(){if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){try{const p=await DeviceOrientationEvent.requestPermission();if(p==='granted'){sensorReady=true;document.getElementById('permission').classList.remove('show');}}catch(err){}}else{sensorReady=true;}}
document.getElementById('stage').addEventListener('pointerdown',()=>{if(!sensorReady){requestTilt();document.getElementById('permission').classList.add('show');setTimeout(()=>document.getElementById('permission').classList.remove('show'),2600);}},{once:true});
resize();
})();
</script>
</body>
</html>
